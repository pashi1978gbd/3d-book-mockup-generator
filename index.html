<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Book Mockup Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="panel">
    <h2>BOOK COVER</h2>

    <label class="upload-box">
      <input type="file" id="coverUpload" accept="image/*">
      <span>Upload Book Cover</span>
    </label>

    <h2>BOOK TITLE</h2>
    <input type="text" id="bookTitle" placeholder="Your Book Title">

    <h2>AUTHOR'S NAME</h2>
    <input type="text" id="authorName" placeholder="Author Name">

    <h2>MOCKUP STYLE</h2>
    <select id="mockupStyle">
      <option>Standing Book</option>
      <option>Angled Book</option>
      <option>Flat Book</option>
    </select>

    <div class="row">
      <div>
        <h2>BACKGROUND</h2>
        <select id="bgSelect">
          <option value="neutral">Neutral Gradient</option>
          <option value="dark">Dark Studio</option>
          <option value="blue">Soft Blue</option>
        </select>
      </div>

      <div>
        <h2>OUTPUT RATIO</h2>
        <select>
          <option>Instagram Post 1:1</option>
          <option>Story 9:16</option>
          <option>Landscape 16:9</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <h2>SHADOW</h2>
        <input type="range" min="0" max="40" value="18" id="shadowRange">
      </div>

      <div>
        <h2>TILT</h2>
        <input type="range" min="-35" max="35" value="12" id="tiltRange">
      </div>
    </div>

    <button id="exportBtn">Export PNG</button>
  </div>

  <div class="preview-area" id="captureArea">
    <div class="book-wrap" id="bookWrap">
      <div class="book-shadow" id="bookShadow"></div>

      <div class="book" id="book">
        <div class="spine"></div>
        <div class="cover" id="coverFace">
          <div class="default-cover">
            <div class="mini-title" id="previewTitle">Your Book Title</div>
            <div class="mini-author" id="previewAuthor">Author Name</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
